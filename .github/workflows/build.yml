name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # counter.py, store.py and engine.py are pure Python, so the logic
      # can be tested without a Mac.
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose

  app:
    name: Build Tally.app
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Draw the app icon
        run: python tools/make_icon.py

      # PyObjC validates selector signatures when a class is defined, so simply
      # importing the AppKit layer on a real Mac catches a whole family of
      # mistakes that never show up on Linux.
      - name: Import the AppKit layer
        run: |
          python -c "import tally.theme, tally.icons, tally.views, tally.panel, tally.app; print('AppKit layer imports cleanly')"

      - name: Build
        run: |
          pyinstaller --noconfirm --clean Tally.spec
          rm -rf dist/Tally
          ditto -c -k --sequesterRsrc --keepParent dist/Tally.app dist/Tally.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tally-app
          path: dist/Tally.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tally.zip
          generate_release_notes: true
