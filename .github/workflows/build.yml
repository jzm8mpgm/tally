name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # counter.py, store.py and engine.py are pure Python, so the logic
      # can be tested without a Mac.
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose

  app:
    # PyInstaller bundles a CPython for the architecture it runs on, so an
    # Apple silicon runner produces an arm64-only app that Intel Macs cannot
    # open at all. Build on both and ship both.
    name: Build Tally.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: test
    # Needed to attach the built app to a release. Without it the build
    # succeeds and the upload fails with a 403.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: apple-silicon
          - runner: macos-13
            arch: intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Draw the app icon
        run: python tools/make_icon.py

      # PyObjC validates selector signatures when a class is defined, so simply
      # importing the AppKit layer on a real Mac catches a whole family of
      # mistakes that never show up on Linux.
      - name: Import the AppKit layer
        run: |
          python -c "import tally.theme, tally.icons, tally.views, tally.panel, tally.app; print('AppKit layer imports cleanly')"

      - name: Build
        run: |
          pyinstaller --noconfirm --clean Tally.spec
          rm -rf dist/Tally
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Tally.app "dist/Tally-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Tally-${{ matrix.arch }}
          path: dist/Tally-${{ matrix.arch }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tally-${{ matrix.arch }}.zip
          generate_release_notes: true
