name: ops-desk dashboard

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post to ops-desk
        env:
          OPS_DESK_TOKEN: ${{ secrets.OPS_DESK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ops-desk.py
